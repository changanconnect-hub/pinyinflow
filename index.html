<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c8102e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>PinyinFlow</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#faf7f2;--card:#ffffff;--ink:#1d1d1f;--mute:#6b6b70;--line:#ebe5da;
  --red:#c8102e;--red2:#fbe9ec;--gold:#b8860b;--gold2:#fff6dc;--green:#1f8a4c;--green2:#e4f3ea;--orange2:#fff1e6;
  --t1:#e03131;--t2:#e8590c;--t3:#2f9e44;--t4:#1971c2;--t5:#868e96;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#121214;--card:#1d1d21;--ink:#f2f2f4;--mute:#9b9ba3;--line:#2c2c32;--red2:#3a1219;--green2:#123222;--gold2:#332a10;--orange2:#3a2010;
  --t1:#ff6b6b;--t2:#ffa94d;--t3:#69db7c;--t4:#74c0fc;--t5:#adb5bd;}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px}
body{padding-bottom:calc(72px + env(safe-area-inset-bottom))}
button{font-family:inherit}
header.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:var(--bg);border-bottom:1px solid var(--line)}
.brand{font-weight:800;font-size:20px;letter-spacing:-.3px}
.brand b{color:var(--red)}
.chips{display:flex;gap:6px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-weight:700;font-size:13px}
main{max-width:560px;margin:0 auto;padding:14px}
.view{display:none}.view.active{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
h2{font-size:22px;margin:4px 0 10px}
h3{font-size:16px;margin:0 0 10px}
.mute{color:var(--mute)}.small{font-size:13px}
.row{display:flex;gap:10px;align-items:center}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stats.four{grid-template-columns:repeat(2,1fr)}
.stat{background:var(--bg);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px}
.stat span{font-size:12px;color:var(--mute)}
.btn{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:12px 14px;font-size:16px;font-weight:600;cursor:pointer;width:100%}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.big{padding:16px;font-size:18px}
.btn.ghost{background:transparent}
.btn.sm{padding:8px 10px;font-size:14px;width:auto}
.btn:disabled{opacity:.45}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.prog{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .3s}
.t1{color:var(--t1)}.t2{color:var(--t2)}.t3{color:var(--t3)}.t4{color:var(--t4)}.t5{color:var(--t5)}
.nocolor .t1,.nocolor .t2,.nocolor .t3,.nocolor .t4,.nocolor .t5{color:inherit}
nav.tabs{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav.tabs button{background:none;border:0;color:var(--mute);padding:10px 0 12px;font-size:12px;font-weight:600}
nav.tabs button span{display:block;font-size:22px;margin-bottom:2px}
nav.tabs button.on{color:var(--red)}
/* home */
.hero{background:linear-gradient(135deg,var(--red),#8f0b20);color:#fff;border:0}
.hero .mute{color:#ffd9de}
.hero .btn.primary{background:#fff;color:var(--red);border-color:#fff}
.day{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.day:first-of-type{border-top:0}
.day .dn{font-weight:700}
.pills{display:flex;gap:6px}
.pill{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:17px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.pill.done{background:var(--green2);border-color:var(--green)}
.pill.next{background:var(--red);border-color:var(--red);color:#fff}
.pill.lock{opacity:.35;cursor:default}
/* session */
.overlay{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column}
.hidden{display:none!important}
.sess-top{display:flex;align-items:center;gap:12px;padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top))}
.sess-top .x{background:none;border:0;font-size:24px;color:var(--mute);padding:0 4px;cursor:pointer}
.sess-top .prog{flex:1}
.sess-top .xp{font-weight:800;font-size:14px;color:var(--gold)}
.sess-body{flex:1;overflow:auto;padding:8px 16px 16px;max-width:560px;width:100%;margin:0 auto;display:flex;flex-direction:column}
.flash{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;min-height:260px}
.tag{display:inline-block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;padding:4px 10px;border-radius:99px;background:var(--red2);color:var(--red)}
.tag.gold{background:var(--gold2);color:var(--gold)}
.tag.green{background:var(--green2);color:var(--green)}
.py{font-size:40px;font-weight:700;line-height:1.25;letter-spacing:.3px}
.py.md{font-size:28px}
.en{font-size:19px;color:var(--mute)}
.hz{font-size:22px;color:var(--mute)}
.note{background:var(--orange2);border-radius:12px;padding:10px 12px;font-size:14px;text-align:left;max-width:440px}
.audio-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.round{width:60px;height:60px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.round.huge{width:104px;height:104px;font-size:44px;background:var(--red);border-color:var(--red);color:#fff;margin:6px auto}
.round.rec{background:var(--red);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
.feedback{min-height:24px;font-weight:700;font-size:15px}
.ok{color:var(--green)}.close{color:var(--gold)}.bad{color:var(--red)}
.bottom{display:grid;gap:8px;padding-top:12px}
.ask{font-size:20px;font-weight:700;margin:8px 0 12px}
.opts{display:grid;gap:8px;margin-top:10px}
.opt{text-align:left;font-size:17px;padding:14px}
.opt.big{text-align:center;font-size:22px}
.opt.right{background:var(--green2);border-color:var(--green)}
.opt.wrong{background:var(--red2);border-color:var(--red)}
/* grammar */
.gbody{font-size:16px;line-height:1.55;margin-bottom:12px}
.gbody b{color:var(--red)}
.ex{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--bg);border-radius:12px;padding:10px 12px;margin-bottom:6px;cursor:pointer}
.ex .p{font-weight:700;font-size:18px}
.ex .e{color:var(--mute);font-size:14px}
.tones{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;margin-bottom:10px}
.tones div{background:var(--bg);border-radius:12px;padding:10px 4px;cursor:pointer}
.tones b{font-size:24px;display:block}
/* sentence chips */
.chips2{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:6px 0}
.chip2{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 10px;cursor:pointer;text-align:center}
.chip2 b{display:block;font-size:17px}
.chip2 small{color:var(--mute);font-size:11px}
/* build */
.line{min-height:62px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:6px;padding:8px 0;margin:14px 0}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:8px}
.tile{border:1px solid var(--line);border-bottom-width:3px;background:var(--card);color:var(--ink);border-radius:12px;padding:10px 14px;font-size:18px;font-weight:700;cursor:pointer}
.tile.used{visibility:hidden}
.blank{display:inline-block;min-width:56px;border-bottom:3px solid var(--red);margin:0 4px}
.sent-line{font-size:24px;font-weight:700;line-height:1.6;margin:10px 0}
/* match */
.match{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.match .col{display:grid;gap:8px}
.mbtn{min-height:56px;font-size:16px}
.mbtn.sel{border-color:var(--t4);background:#e7f1fb}
.mbtn.gone{visibility:hidden}
.mbtn.wrong{background:var(--red2);border-color:var(--red)}
@media (prefers-color-scheme:dark){.mbtn.sel{background:#14304a}}
/* dialogue */
.dlg{display:flex;flex-direction:column;gap:10px;padding:6px 0}
.bub{max-width:84%;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px;cursor:pointer}
.bub.me{align-self:flex-end;background:var(--green2);border-color:transparent}
.bub .who{font-size:11px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.5px}
.bub .p{font-size:19px;font-weight:700;margin:2px 0}
.bub .e{font-size:13px;color:var(--mute)}
.bub.turn{border:2px dashed var(--green);background:transparent}
/* sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--line);animation:up .18s ease-out}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheet.okk{background:var(--green2)}.sheet.badd{background:var(--red2)}
.sheet .in{max-width:560px;margin:0 auto}
.sheet h3{margin:0 0 6px}
.sheet .p{font-size:20px;font-weight:700}
.sheet .btn{margin-top:12px}
.sheet.okk .btn{background:var(--green);border-color:var(--green);color:#fff}
.sheet.badd .btn{background:var(--red);border-color:var(--red);color:#fff}
/* misc */
.set{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.set:last-child{border-bottom:0}
select{padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:15px}
.bars{display:flex;align-items:flex-end;gap:4px;height:80px;margin-top:8px}
.bars div{flex:1;background:var(--green);border-radius:4px 4px 0 0;min-height:3px;opacity:.85}
.bars div.zero{background:var(--line)}
.bars div.rest{background:var(--gold);opacity:.4}
.blabels{display:flex;gap:4px;font-size:10px;color:var(--mute);margin-top:4px}
.blabels span{flex:1;text-align:center}
.acc{border-top:1px solid var(--line);padding:12px 0}
.acc:first-of-type{border-top:0}
.acc-h{display:flex;justify-content:space-between;cursor:pointer;font-weight:700}
.gnote{background:var(--bg);border-radius:14px;padding:12px;margin-top:10px}
.gnote h4{margin:0 0 6px;font-size:16px}
.w{display:flex;justify-content:space-between;align-items:center;padding:9px 4px;border-bottom:1px dashed var(--line);cursor:pointer;gap:10px}
.w:last-child{border-bottom:0}
.w .p{font-weight:700;font-size:17px}
.w .e{color:var(--mute);font-size:14px;text-align:right}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .2s;z-index:50;pointer-events:none;max-width:90%}
#toast.show{opacity:1}
.warn{background:var(--orange2)}
.combo{font-size:13px;font-weight:800;color:var(--gold);margin-left:6px}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><b>拼</b> PinyinFlow</div>
  <div class="chips"><div class="chip" id="xpChip">⭐ 0</div><div class="chip" id="streakChip">🔥 0</div></div>
</header>

<main>
  <section id="v-learn" class="view active"></section>
  <section id="v-practice" class="view"></section>
  <section id="v-notes" class="view"></section>
  <section id="v-me" class="view"></section>
</main>

<nav class="tabs">
  <button data-v="learn" class="on"><span>🏠</span>Learn</button>
  <button data-v="practice"><span>🎧</span>Practice</button>
  <button data-v="notes"><span>📒</span>Notes</button>
  <button data-v="me"><span>⚙️</span>Me</button>
</nav>

<div id="session" class="overlay hidden">
  <div class="sess-top">
    <button class="x" onclick="quitSession()">✕</button>
    <div class="prog"><i id="sessBar" style="width:0%"></i></div>
    <span class="xp" id="sessXp">⭐ 0</span>
  </div>
  <div class="sess-body" id="sessBody"></div>
</div>
<div id="sheet" class="sheet hidden"><div class="in"><div id="sheetIn"></div><button class="btn big" id="sheetBtn" onclick="next()">Continue</button></div></div>
<div id="toast"></div>

<script>
/* =====================================================================
   DICTIONARY  key: [characters (for the voice), pinyin, English, flag]
   flag 1 = tone-changed form (not taught separately), 2 = a name
   ===================================================================== */
const L={
 ni:["你","nǐ","you"], wo:["我","wǒ","I / me"], hao:["好","hǎo","good"], hen:["很","hěn","very"],
 ma:["吗","ma","(question word)"], xiexie:["谢谢","xièxie","thank you"], buke:["不客气","bú kèqi","you're welcome"], zaijian:["再见","zàijiàn","goodbye"],
 shi:["是","shì","am / is / are"], bu:["不","bù","not"], bu2:["不","bú","not",1], ta:["他","tā","he"], ta2:["她","tā","she"],
 ren:["人","rén","person"], zhongguo:["中国","Zhōngguó","China"], asbj:["阿塞拜疆","Āsàibàijiāng","Azerbaijan"],
 laoshi:["老师","lǎoshī","teacher"], xuesheng:["学生","xuésheng","student"], women:["我们","wǒmen","we"],
 ne:["呢","ne","and …? / what about …?"], shenme:["什么","shénme","what"], jiao:["叫","jiào","to be called"],
 mingzi:["名字","míngzi","name"], ye:["也","yě","also / too"], dui:["对","duì","right / yes"],
 de:["的","de","'s (my, your…)"], baba:["爸爸","bàba","dad"], mama:["妈妈","māma","mom"], gege:["哥哥","gēge","older brother"],
 jiejie:["姐姐","jiějie","older sister"], pengyou:["朋友","péngyou","friend"], zhe:["这","zhè","this"], na:["那","nà","that"],
 you:["有","yǒu","to have"], meiyou:["没有","méiyǒu","not have"], ge:["个","ge","(counting word)"], liang:["两","liǎng","two (of something)"],
 ji:["几","jǐ","how many"],
 yi:["一","yī","1"], yi2:["一","yí","1",1], er:["二","èr","2"], san:["三","sān","3"], si:["四","sì","4"], wu:["五","wǔ","5"],
 liu:["六","liù","6"], qi:["七","qī","7"], ba:["八","bā","8"], jiu:["九","jiǔ","9"], shi2:["十","shí","10"],
 yao:["要","yào","to want"], xiang:["想","xiǎng","would like to"], mai:["买","mǎi","to buy"], zhege:["这个","zhège","this one"],
 nage:["那个","nàge","that one"], duoshao:["多少","duōshao","how much / how many"], qian:["钱","qián","money"],
 kuai:["块","kuài","yuan (money)"], tai:["太","tài","too (much)"], le:["了","le","(ending: 太…了)"], gui:["贵","guì","expensive"],
 pianyi:["便宜","piányi","cheap"], cha:["茶","chá","tea"], shui:["水","shuǐ","water"],
 laoban:["老板","lǎobǎn","boss / shop owner"], keyi:["可以","kěyǐ","can / OK"], yidian:["一点","yìdiǎn","a little"],
 lin:["林","Lín","Lin (a name)",2], ali:["阿里","Ālǐ","Ali (a name)",2]
};
const TIP={
 ni:"3rd tone: go low, then a little up.", hao:"Also 3rd tone. In 你好 the first 3rd tone becomes 2nd → ní hǎo.",
 hen:"In 很好 both are 3rd tones → said hén hǎo.", ma:"No tone — short and light, like Azerbaijani 'mı'.",
 xiexie:"The second 'xie' is light and short.", buke:"Say it as one word. Means 'don't be polite'.",
 shi:"'sh' + a buzzing sound — not 'shee'. Falling tone, like a firm order.", bu:"Changes to bú before a 4th tone: 不是 = bú shì.",
 ta:"他 (he) and 她 (she) sound exactly the same!", ta2:"Sounds exactly like 他 (he). Only the writing is different.",
 zhongguo:"中 = middle, 国 = country → 'the Middle Country'.", xuesheng:"学 = study, 生 = person. The 'sheng' is light.",
 asbj:"Long word — say it slowly: Ā-sài-bài-jiāng.", ne:"Light and short, like 'Bəs sən?'.",
 ye:"Always goes before the verb: 我也是…", dui:"Very common: 'right!', 'yes, that's it'.",
 de:"Light and short. The most common word in Chinese!", zhe:"zh = like 'j' with your tongue curled back.",
 na:"Falling tone. Don't mix up with nǎ (which?).", you:"Like Azerbaijani 'var'.", meiyou:"Like Azerbaijani 'yox'. Never say 不有.",
 ge:"Light tone. Goes between a number and a thing: 三个人.", liang:"'Two OF something': 两个. For counting 1, 2, 3 use èr.",
 ji:"j = like 'j' in 'jeep'.", qi:"q = like 'ch' in 'cheese' → 'chee'.", si:"s + a buzzing sound — not 'see'.",
 shi2:"shí (10) rises. shì (to be) falls. sì (4) falls. Listen carefully!", er:"Like 'ar' with the tongue curled.",
 xiang:"x = a soft 'sh' with a smile.", qian:"q = 'ch' sound → 'chyen'.", le:"Light. Used with 太: 太贵了!",
 cha:"ch with the tongue curled back.", keyi:"Two 3rd tones → said ké yǐ.", laoban:"Two 3rd tones → said láo bǎn.",
 zhege:"这 + 个 = this one.", nage:"那 + 个 = that one.", yidian:"一 becomes yì before a 3rd tone."
};

/* =====================================================================
   WEEK 1 — 7 days.  Sentences: [characters, token keys, English, grammar #]
   ===================================================================== */
const RAW=[
{title:"Hello!",goal:"Greet people, say how you are, thank and say goodbye.",
 words:"ni wo hao hen ma xiexie buke zaijian",focus:"hen ma hao ni wo",
 gram:[
  {title:"The 4 tones",tones:true,body:`Every syllable has a <b>tone</b>. Change the tone and the meaning changes. Tap each one to hear it:`,
   after:`Colors in this app: <span class="t1">red = 1st</span> (high, flat), <span class="t2">orange = 2nd</span> (rising, like "Hm?"), <span class="t3">green = 3rd</span> (low dip), <span class="t4">blue = 4th</span> (falling, like a firm "Dur!"), <span class="t5">gray = light</span> (short and soft).`,ex:[]},
  {title:"你好 = you + good",body:`Chinese builds words like Lego. <b>你</b> (you) + <b>好</b> (good) = <b>你好</b> = hello.<br><br>Two 3rd tones together? The first one becomes a 2nd tone. So 你好 is said <b>ní hǎo</b>.`,ex:[["你好！","ni hao","Hello!"]]},
  {title:"No 'am' with adjectives",body:`In Azerbaijani you say "Mən yaxşı<b>yam</b>". Chinese has no "-am / is" before adjectives. Instead put <b>很</b> (very):<br><br><b>我很好</b> = I (am) fine.<br><br>Here 很 doesn't really mean "very" — it's just the normal way to say it.`,ex:[["我很好。","wo hen hao","I'm fine."]]},
  {title:"吗 makes a question",body:`Put <b>吗</b> at the end and the sentence becomes a question — just like Azerbaijani <b>mı / mi</b>:<br><br>你好 → <b>你好吗？</b> = How are you?<br><br>More about this on Day 3.`,ex:[["你好吗？","ni hao ma","How are you?"]]}
 ],
 sents:[["你好！","ni hao","Hello!",1],["我很好。","wo hen hao","I'm fine.",2],["你很好。","ni hen hao","You are good.",2],
  ["我很好，谢谢！","wo hen hao , xiexie","I'm fine, thanks!",2],["你好吗？","ni hao ma","How are you?",3],["谢谢你！","xiexie ni","Thank you!",-1]],
 dlg:[["lin","你好！","ni hao","Hello!"],["ali","你好！","ni hao","Hello!"],["lin","你好吗？","ni hao ma","How are you?"],
  ["ali","我很好，谢谢！","wo hen hao , xiexie","I'm fine, thanks!"],["lin","再见！","zaijian","Goodbye!"],["ali","再见！","zaijian","Goodbye!"]]},

{title:"Who are you?",goal:"Say who you are, where you're from, and what you're not.",
 words:"shi bu ta ta2 ren zhongguo asbj laoshi xuesheng women",focus:"shi bu2 ren",
 gram:[
  {title:"A 是 B = A is B",body:`<b>是</b> (shì) links two things: <b>我是学生</b> = I am (a) student.<br><br>Word order is like English: <b>I – am – student</b>. Azerbaijani puts "am" at the end (Mən tələbə<b>yəm</b>) — Chinese puts it in the middle.<br><br>No "a / an", and 是 never changes: same for I, you, he, we.`,ex:[["她是老师。","ta2 shi laoshi","She is a teacher."]]},

const cap=s=>s?s[0].toUpperCase()+s.slice(1):s;
function spy(s){let out="";s.t.forEach(k=>{if(PUN[k]){out=out.trimEnd()+PUN[k]+" ";}else{out+=L[k][1]+" ";}});out=out.trim();const e=s.hz.slice(-1);out+=e==="？"?"?":e==="！"?"!":e==="。"?".":"";return cap(out).replace(/([.!?] )(\S)/g,(m,a,c)=>a+c.toUpperCase());}
function mk(a,g){const s={hz:a[0],t:a[1].split(" "),en:a[2],g:g===undefined?-1:g};s.id=s.hz;s.py=spy(s);if(!SENTS[s.id])SENTS[s.id]=s;return s;}

/* ================== HELPERS ================== */
const $=id=>document.getElementById(id);
const DAY=864e5;
function dkey(d){d=d||new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function sod(t){const d=new Date(t);d.setHours(0,0,0,0);return d.getTime();}
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const pick=a=>a[Math.floor(Math.random()*a.length)];
let R=[];function r(x){R.push(x);return "R["+(R.length-1)+"]";}
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),2600);}

/* ================== PINYIN ================== */
const V="aeiouüāáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜĀÁǍÀĒÉĚÈ";
const SYL=new RegExp("(zh|ch|sh|[bpmfdtnlgkhjqxzcsrwy])?["+V+"]+(ng|n(?!["+V+"])|r(?!["+V+"]))?","gi");
const MARKS={a:"āáǎà",e:"ēéěè",i:"īíǐì",o:"ōóǒò",u:"ūúǔù","ü":"ǖǘǚǜ"};
const BASE={};Object.entries(MARKS).forEach(([b,s])=>[...s].forEach((c,i)=>{BASE[c]=[b,i+1];BASE[c.toUpperCase()]=[b.toUpperCase(),i+1];}));
function toneOf(s){for(const c of s){if(BASE[c])return BASE[c][1];}return 5;}
function cpy(py){return py.replace(SYL,m=>'<span class="t'+toneOf(m)+'">'+m+'</span>');}
function plain(s){return s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();}
function mark(s,t){let idx;if(s.includes("a"))idx=s.indexOf("a");else if(s.includes("e"))idx=s.indexOf("e");else if(s.includes("ou"))idx=s.indexOf("o");else{for(let i=s.length-1;i>=0;i--)if("iouü".includes(s[i])){idx=i;break;}}if(idx===undefined)return s;return s.slice(0,idx)+MARKS[s[idx]][t-1]+s.slice(idx+1);}
function retone(syl,t){const bare=[...syl].map(c=>BASE[c]?BASE[c][0]:c).join("");const m=mark(bare.toLowerCase(),t);return bare[0]!==bare[0].toLowerCase()?m[0].toUpperCase()+m.slice(1):m;}
function variants(py){
  const parts=[];let last=0;
  py.replace(SYL,(m,...a)=>{const off=a[a.length-2];parts.push({pre:py.slice(last,off),syl:m,t:toneOf(m)});last=off+m.length;return m;});
  const tail=py.slice(last);const toned=parts.map((p,i)=>p.t<5?i:-1).filter(i=>i>=0);if(!toned.length)return[];
  const out=new Set();
  for(let n=0;n<80&&out.size<3;n++){
    const ts=parts.map(p=>p.t);const i=pick(toned);let nt;do{nt=1+Math.floor(Math.random()*4);}while(nt===parts[i].t);ts[i]=nt;
    if(toned.length>1&&Math.random()<0.35){const j=pick(toned);if(j!==i){let n2;do{n2=1+Math.floor(Math.random()*4);}while(n2===parts[j].t);ts[j]=n2;}}
    const s=parts.map((p,k)=>p.pre+(ts[k]===p.t?p.syl:retone(p.syl,ts[k]))).join("")+tail;if(s!==py)out.add(s);
  }
  return[...out];
}

function say(text,slow){

}

/* ================== SOUND EFFECTS ================== */
let actx=null;
function beep(ok){
  if(!S.settings.sfx)return;
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const t0=actx.currentTime;
    (ok?[[660,0],[990,.09]]:[[200,0],[150,.12]]).forEach(([f,dt])=>{const o=actx.createOscillator(),g=actx.createGain();o.type=ok?"sine":"triangle";o.frequency.value=f;g.gain.setValueAtTime(0.0001,t0+dt);g.gain.exponentialRampToValueAtTime(0.18,t0+dt+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t0+dt+0.18);o.connect(g).connect(actx.destination);o.start(t0+dt);o.stop(t0+dt+0.2);});
  }catch(e){}
}

/* ================== SPEAKING CHECK ================== */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let recog=null;
const SAME=[["他","她","它"],["在","再"],["的","得"],["么","麽"],["林","琳","霖","临"],["阿里","阿丽","阿莉"]];
function numZh(n){const D="零一二三四五六七八九";if(n<10)return D[n];if(n>=100000)return String(n);const parts=[[10000,"万"],[1000,"千"],[100,"百"],[10,"十"]];let out="",zero=false;for(const [v,u] of parts){const q=Math.floor(n/v);n%=v;if(q){if(zero)out+="零";out+=(q===1&&v===10&&!out?"":D[q])+u;zero=false;}else if(out)zero=true;}if(n){if(zero)out+="零";out+=D[n];}return out;}
function norm(s){s=s.replace(/\d+/g,n=>numZh(+n));SAME.forEach(g=>{g.slice(1).forEach(c=>{s=s.split(c).join(g[0]);});});return s.replace(/[^一-鿿]/g,"");}
function similarity(exp,got){const a=norm(exp),b=norm(got);if(!a.length)return 0;const pool=b.split("");let hit=0;for(const c of a){const i=pool.indexOf(c);if(i>=0){hit++;pool.splice(i,1);}}const extra=Math.max(0,b.length-a.length);return Math.max(0,(hit-extra*0.5)/a.length);}
function checkSpeech(hz,btn){
  const fb=$("fb");
  if(!SR){fb.innerHTML='<span class="mute">Speaking check needs Chrome.</span>';return;}
  if(recog){try{recog.abort();}catch(e){}recog=null;btn.classList.remove("rec");return;}
  speechSynthesis.cancel();
  recog=new SR();recog.lang="zh-CN";recog.interimResults=false;recog.maxAlternatives=5;
  btn.classList.add("rec");fb.innerHTML='<span class="mute">Listening… say it now</span>';let got=false;
  recog.onresult=e=>{got=true;const alts=[...e.results[0]].map(a=>a.transcript);let best=0,bestT=alts[0]||"";
    alts.forEach(t=>{const s=similarity(hz,t);if(s>best){best=s;bestT=t;}});window._heard=bestT;
    const hear=' <button class="btn sm ghost" onclick="say(window._heard)">▶ what I heard</button>';
    if(best>=0.99){fb.innerHTML='<span class="ok">✅ Perfect!</span>';beep(true);}
    else if(best>=0.5)fb.innerHTML='<span class="close">🙂 Close — listen and try again</span>'+hear;
    else fb.innerHTML='<span class="bad">❌ Not yet — listen again</span>'+hear;};
  recog.onerror=e=>{fb.innerHTML='<span class="mute">'+(e.error==="no-speech"?"I didn't hear anything. Tap 🎤 and speak.":e.error==="not-allowed"?"Allow the microphone for this site.":e.error==="network"?"Speaking check needs internet.":"Mic error: "+e.error)+'</span>';};
  recog.onend=()=>{btn.classList.remove("rec");recog=null;if(!got&&fb.innerHTML.includes("Listening"))fb.innerHTML='<span class="mute">Tap 🎤 and speak.</span>';};
  try{recog.start();}catch(e){btn.classList.remove("rec");recog=null;}
}

/* ================== MEMORY (spaced repetition) ================== */
function newCard(){return{reps:0,ivl:0,ease:2.5,due:Date.now(),lapses:0};}
function schedule(c,g){
  if(g===0){c.lapses++;c.reps=0;c.ivl=0;c.ease=Math.max(1.3,c.ease-0.2);c.due=Date.now();return c;}
  if(c.reps===0)c.ivl=1;else if(c.reps===1)c.ivl=3;else c.ivl=Math.max(c.ivl+1,Math.round(c.ivl*c.ease));
  c.reps++;c.due=sod(Date.now())+c.ivl*DAY;return c;
}
function itemKey(st){return st.k?"w:"+st.k:"s:"+st.s.id;}
function dueKeys(){const e=sod(Date.now())+DAY-1;return Object.keys(S.cards).filter(k=>S.cards[k].due<=e);}
function addCard(key){if(!S.cards[key]){S.cards[key]=schedule(newCard(),2);}}

/* ================== PROGRESS ================== */
const today=()=>dkey();
function logAct(n){const t=today();S.log[t]=(S.log[t]||0)+(n||1);}
function addXp(n){const t=today();S.xp[t]=(S.xp[t]||0)+n;}
const isDone=(d,p)=>!!S.done[d+"-"+p];
const dayDone=d=>isDone(d,0)&&isDone(d,1)&&isDone(d,2);
function avail(d,p){if(d>0&&!dayDone(d-1))return false;if(p>0&&!isDone(d,p-1))return false;return true;}
function nextPart(){for(let d=0;d<DAYS.length;d++)for(let p=0;p<3;p++)if(!isDone(d,p)&&avail(d,p))return[d,p];return null;}
function maxDay(){let m=0;for(let d=0;d<DAYS.length;d++)if(avail(d,0))m=d;return m;}
function streak(){let n=0,d=new Date();d.setHours(12,0,0,0);if(!(S.log[dkey(d)]>0))d=new Date(d.getTime()-DAY);
  for(let i=0;i<2000;i++){const k=dkey(d);if(S.log[k]>0)n++;else if(d.getDay()!==S.settings.restDay)break;d=new Date(d.getTime()-DAY);}return n;}
const totalXp=()=>Object.values(S.xp).reduce((a,b)=>a+b,0);

/* ================== OPTION POOLS ================== */
function knownWords(d){const o=[];for(let i=0;i<=Math.min(d,DAYS.length-1);i++)DAYS[i].W.forEach(k=>o.push(k));return o;}
const goodWord=k=>!L[k][3];
function distinct(correct,cands,label,n){const seen=new Set(correct?[label(correct)]:[]);const out=[];for(const c of cands){const l=label(c);if(!seen.has(l)){seen.add(l);out.push(c);}if(out.length>=n)break;}return out;}
function wordPool(d,k){let p=shuffle(knownWords(d).filter(x=>x!==k&&goodWord(x)));if(p.length<6)p=p.concat(shuffle(knownWords(d+1).filter(x=>x!==k&&goodWord(x)&&!p.includes(x))));if(p.length<6)p=p.concat(shuffle(Object.keys(L).filter(x=>x!==k&&goodWord(x))));return p;}
function distractTiles(s,d,n){const used=new Set(tiles(s).map(k=>L[k][1]));const p=wordPool(d).filter(k=>!used.has(L[k][1]));return distinct("",p,k=>L[k][1],n);}

/* ================== LESSON BUILDER ================== */
function canTone(k){return goodWord(k)&&variants(L[k][1]).length>=3;}
function stepFor(key,d){
  if(key.startsWith("w:")){const k=key.slice(2);if(!L[k])return null;const o=["lc","ep"];if(canTone(k))o.push("tone");return{t:pick(o),k,rev:true};}
  const s=SENTS[key.slice(2)];if(!s)return null;const o=["lc"];if(tiles(s).length>=2)o.push("build","build","fill");const t=pick(o);
  return t==="build"?{t,s,mode:pick(["en","audio"]),rev:true}:{t,s,rev:true};
}
function reviewSteps(n,d){
  let keys=dueKeys().sort((a,b)=>S.cards[a].due-S.cards[b].due);
  if(keys.length<n)keys=keys.concat(shuffle(Object.keys(S.cards).filter(k=>!keys.includes(k))));
  return shuffle(keys.slice(0,n)).map(k=>stepFor(k,d)).filter(Boolean);
}
function buildPart(d,p){
  const D=DAYS[d],st=[];
  if(p===0){
    if(d>0)st.push({t:"info",title:"Warm-up 🔥",text:"First, a quick review of earlier words and sentences."},...reviewSteps(d===6?10:6,d));
    if(d>0||st.length)st.push({t:"info",title:"Day "+(d+1)+": "+D.title,text:D.goal});
    else st.push({t:"info",title:"Day 1: "+D.title,text:D.goal+" Listen to every word and say it out loud."});
    const W=D.W;
    for(let i=0;i<W.length;i+=3){
      const ch=W.slice(i,i+3);
      ch.forEach(k=>st.push({t:"word",k}));
      shuffle(ch).forEach(k=>st.push({t:"lc",k}));
      shuffle(ch).forEach(k=>st.push({t:"ep",k}));
      const tk=ch.filter(canTone);if(tk.length)st.push({t:"tone",k:pick(tk)});
    }
    const mw=shuffle(W.filter(goodWord));
    for(let i=0;i<mw.length;i+=5){const g=mw.slice(i,i+5);if(g.length>=3)st.push({t:"match",ks:g});else if(i>0)st.push({t:"match",ks:mw.slice(Math.max(0,i-3),i).concat(g)});}
    shuffle(W.filter(goodWord)).slice(0,4).forEach(k=>st.push({t:pick(["lc","ep"]),k}));
  }
  if(p===1){
    D.G.forEach((g,gi)=>{
      st.push({t:"gram",d,gi});
      D.S.filter(s=>s.g===gi).forEach(s=>{st.push({t:"sent",s});if(tiles(s).length>=2)st.push({t:"build",s,mode:"en"});});
    });
    D.S.filter(s=>s.g===-1).forEach(s=>{st.push({t:"sent",s});if(tiles(s).length>=2)st.push({t:"build",s,mode:"en"});});
    const multi=D.S.filter(s=>tiles(s).length>=2);
    shuffle(multi).slice(0,3).forEach(s=>st.push({t:"fill",s}));
    shuffle(multi).slice(0,3).forEach(s=>st.push({t:"build",s,mode:"audio"}));
    shuffle(D.S).slice(0,3).forEach(s=>st.push({t:"lc",s}));
  }
  if(p===2){
    st.push({t:"dlg",d});
    const lines=D.DL.map(x=>x.s).filter(s=>tiles(s).length>=2);
    const uniq=[...new Map(lines.map(s=>[s.id,s])).values()];
    shuffle(uniq).slice(0,3).forEach(s=>st.push({t:"lc",s}));
    shuffle(uniq).slice(0,2).forEach(s=>st.push({t:"build",s,mode:"audio"}));
    st.push({t:"role",d});
    shuffle(D.S.filter(s=>tiles(s).length>=2)).slice(0,4).forEach(s=>st.push({t:"speak",s}));
  }
  return st.filter(Boolean);
}

/* ================== SESSION ================== */
let SS=null;
function openSess(o){SS=Object.assign({i:0,xp:0,right:0,wrong:0,combo:0,t0:Date.now()},o);$("session").classList.remove("hidden");document.body.style.overflow="hidden";renderStep();}
function startPart(d,p){if(!avail(d,p)){toast("Finish the earlier lessons first 🔒");return;}openSess({kind:"part",d,p,steps:buildPart(d,p)});}
function startReview(){if(!Object.keys(S.cards).length){toast("Finish your first lesson part first");return;}const d=maxDay();openSess({kind:"review",d,steps:reviewSteps(Math.min(20,Math.max(10,dueKeys().length)),d)});}
function startShadow(d){openSess({kind:"shadow",d,steps:[{t:"dlg",d},{t:"role",d}]});}
function quitSession(){
  if(SS&&SS.kind==="part"&&SS.i<SS.steps.length&&SS.i>2&&!confirm("Leave this lesson? You'll need to start this part again."))return;
  closeSess();
}
function closeSess(){if(recog){try{recog.abort();}catch(e){}}try{speechSynthesis.cancel();}catch(e){}hideSheet();$("session").classList.add("hidden");document.body.style.overflow="";SS=null;render();}
function bar(){$("sessBar").style.width=(SS.i/Math.max(SS.steps.length,1)*100)+"%";$("sessXp").textContent="⭐ "+SS.xp;}
function next(){hideSheet();if(!SS)return;SS.i++;if(SS.i>=SS.steps.length)finish();else renderStep();}
function hideSheet(){$("sheet").classList.add("hidden");}
const cont=(label)=>'<div class="bottom"><button class="btn primary big" onclick="next()">'+(label||"Continue")+'</button></div>';
const hzl=hz=>S.settings.showHz?'<div class="hz">'+hz+'</div>':"";
function audioRow(hz){return'<div class="audio-row"><button class="round" onclick="say('+r(hz)+')">🔊</button><button class="round" onclick="say('+r(hz)+',true)">🐢</button><button class="round" onclick="checkSpeech('+r(hz)+',this)">🎤</button></div><div class="feedback" id="fb"></div>';}
function itemOf(st){if(st.k){const w=L[st.k];return{hz:w[0],py:w[1],en:w[2]};}return{hz:st.s.hz,py:st.s.py,en:st.s.en};}

function answer(ok,st,extra){
  if(SS.answered)return;SS.answered=true;beep(ok);
  const key=itemKey(st);if(S.cards[key])schedule(S.cards[key],ok?2:0);
  if(ok){SS.right++;SS.combo++;const x=10+(SS.combo>=3?5:0);SS.xp+=x;addXp(x);}
  else{SS.wrong++;SS.combo=0;if(!st.retry)SS.steps.push(Object.assign({},st,{retry:true}));}
  logAct();save();bar();
  const it=itemOf(st);R.length=R.length;const rr=r(it.hz);
  $("sheetIn").innerHTML=(ok?'<h3 class="ok">✅ Correct!'+(SS.combo>=3?'<span class="combo">🔥 '+SS.combo+' in a row!</span>':"")+'</h3>':'<h3 class="bad">❌ Correct answer:</h3>')+
    '<div class="row" style="justify-content:space-between"><div><div class="p">'+cpy(it.py)+'</div>'+(S.settings.showHz?'<div class="mute">'+it.hz+'</div>':"")+'<div class="mute">'+it.en+'</div></div><button class="round" onclick="say('+rr+')">🔊</button></div>'+(extra||"")+(!ok?'<div class="small mute" style="margin-top:6px">It will come back at the end.</div>':"");
  const sh=$("sheet");sh.classList.remove("hidden","okk","badd");sh.classList.add(ok?"okk":"badd");
  setTimeout(()=>say(it.hz),ok?280:450);
}

function renderStep(){
  R=[];SS.answered=false;hideSheet();bar();
  const st=SS.steps[SS.i],b=$("sessBody");b.scrollTop=0;
  ({info:rInfo,word:rWord,gram:rGram,sent:rSent,lc:rLc,ep:rEp,tone:rTone,build:rBuild,fill:rFill,match:rMatch,speak:rSpeak,dlg:rDlg,role:rRole})[st.t](st,b);
}
function rInfo(st,b){b.innerHTML='<div class="flash"><div style="font-size:54px">'+(st.title.includes("Warm")?"🔥":"🎯")+'</div><div class="py md">'+st.title+'</div><div class="en">'+st.text+'</div></div>'+cont("Let's go");}
function rWord(st,b){const w=L[st.k];SS.xp+=2;addXp(2);
  b.innerHTML='<div class="flash"><span class="tag">New word</span><div class="py">'+cpy(w[1])+'</div>'+hzl(w[0])+'<div class="en">'+w[2]+'</div>'+(TIP[st.k]?'<div class="note">💡 '+TIP[st.k]+'</div>':"")+audioRow(w[0])+'<div class="small mute">Listen, then say it out loud 2–3 times</div></div>'+cont();
  auto(w[0]);}
function toneGrid(){return'<div class="tones">'+[["妈",1,"high & flat"],["麻",2,"rising ↗"],["马",3,"low dip ↘↗"],["骂",4,"falling ↘"]].map(x=>'<div onclick="say(\''+x[0]+'\')"><b class="t'+x[1]+'">'+mark("ma",x[1])+'</b><span class="small mute">'+x[2]+'</span></div>').join("")+'</div><p class="small mute" style="margin-top:0">mā = mom · má = hemp · mǎ = horse · mà = to scold</p>';}
function exRow(s){return'<div class="ex" onclick="say('+r(s.hz)+')"><div><div class="p">'+cpy(s.py)+'</div>'+(S.settings.showHz?'<div class="mute small">'+s.hz+'</div>':"")+'<div class="e">'+s.en+'</div></div><span>🔊</span></div>';}
function gramHtml(g){return'<div class="gbody">'+g.body+'</div>'+(g.tones?toneGrid():"")+(g.after?'<div class="gbody small">'+g.after+'</div>':"")+g.ex.map(exRow).join("");}
function rGram(st,b){const g=DAYS[st.d].G[st.gi];SS.xp+=2;addXp(2);
  b.innerHTML='<div style="flex:1"><span class="tag gold">Grammar</span><h2>'+g.title+'</h2>'+gramHtml(g)+'</div>'+cont("Got it");}
function rSent(st,b){const s=st.s;SS.xp+=2;addXp(2);
  const chips=tiles(s).map(k=>'<div class="chip2" onclick="say('+r(L[k][0])+')"><b>'+cpy(L[k][1])+'</b><small>'+L[k][2]+'</small></div>').join("");
  b.innerHTML='<div class="flash"><span class="tag green">New sentence</span><div class="py md">'+cpy(s.py)+'</div>'+hzl(s.hz)+'<div class="en">'+s.en+'</div><div class="chips2">'+chips+'</div>'+audioRow(s.hz)+'</div>'+cont();
  auto(s.hz);}
function optButtons(opts,cls){return'<div class="opts">'+opts.map((o,j)=>'<button class="btn opt '+(cls||"")+'" id="o'+j+'" onclick="pickOpt('+j+')">'+o.label+'</button>').join("")+'</div>';}
function pickOpt(j){if(SS.answered){const o=SS.opts[j];if(o.hz)say(o.hz);return;}const st=SS.steps[SS.i];SS.opts.forEach((o,i)=>{if(o.ok)$("o"+i).classList.add("right");});if(!SS.opts[j].ok)$("o"+j).classList.add("wrong");answer(SS.opts[j].ok,st);}
function rLc(st,b){
  const it=itemOf(st);let opts;
  if(st.k){opts=[{label:it.en,ok:true}].concat(distinct(st.k,wordPool(SS.d,st.k),k=>L[k][2],3).map(k=>({label:L[k][2],hz:L[k][0]})));}
  else{const pool=shuffle(Object.values(SENTS).filter(x=>x.id!==st.s.id));opts=[{label:it.en,ok:true}].concat(distinct(st.s,pool,x=>x.en,3).map(x=>({label:x.en,hz:x.hz})));}
  SS.opts=shuffle(opts);
  b.innerHTML='<div style="flex:1;text-align:center"><div class="ask">What does this mean?</div><button class="round huge" onclick="say('+r(it.hz)+')">🔊</button><button class="btn sm ghost" onclick="say('+r(it.hz)+',true)">🐢 slower</button>'+optButtons(SS.opts)+'</div>';
  auto(it.hz);}
function rEp(st,b){
  const w=L[st.k];const opts=[{label:cpy(w[1]),ok:true}].concat(distinct(st.k,wordPool(SS.d,st.k),k=>L[k][1],3).map(k=>({label:cpy(L[k][1]),hz:L[k][0]})));
  SS.opts=shuffle(opts);
  b.innerHTML='<div style="flex:1;text-align:center"><div class="ask">How do you say…</div><div class="py md">"'+w[2]+'"</div>'+optButtons(SS.opts,"big")+'</div>';}
function rTone(st,b){
  const w=L[st.k];const opts=[{label:w[1],ok:true}].concat(shuffle(variants(w[1])).slice(0,3).map(v=>({label:v})));
  SS.opts=shuffle(opts);
  b.innerHTML='<div style="flex:1;text-align:center"><div class="ask">Which tones did you hear?</div><button class="round huge" onclick="say('+r(w[0])+')">🔊</button><button class="btn sm ghost" onclick="say('+r(w[0])+',true)">🐢 slower</button><div class="small mute">'+w[2]+'</div>'+optButtons(SS.opts,"big")+'</div>';
  auto(w[0]);}
/* build a sentence from tiles */
function rBuild(st,b){
  const s=st.s;SS.bank=shuffle(tiles(s).concat(distractTiles(s,SS.d,Math.min(3,tiles(s).length>4?3:2)))).map(k=>({k,py:L[k][1],used:false}));SS.line=[];
  const head=st.mode==="en"?'<div class="ask">Translate this</div><div class="py md" style="text-align:center">'+s.en+'</div>':'<div class="ask">Tap what you hear</div><button class="round huge" onclick="say('+r(s.hz)+')">🔊</button><button class="btn sm ghost" style="display:block;margin:0 auto" onclick="say('+r(s.hz)+',true)">🐢 slower</button>';
  b.innerHTML='<div style="flex:1;text-align:center">'+head+'<div class="line" id="line"></div><div class="bank" id="bank"></div></div><div class="bottom"><button class="btn primary big" id="chk" onclick="checkBuild()" disabled>Check</button></div>';
  drawBuild();if(st.mode==="audio")auto(s.hz);}
function drawBuild(){
  $("line").innerHTML=SS.line.map((j,n)=>'<button class="tile" onclick="unTile('+n+')">'+cpy(SS.bank[j].py)+'</button>').join("");
  $("bank").innerHTML=SS.bank.map((t,j)=>'<button class="tile'+(t.used?" used":"")+'" onclick="useTile('+j+')">'+cpy(t.py)+'</button>').join("");
  $("chk").disabled=!SS.line.length;}
function useTile(j){if(SS.answered||SS.bank[j].used)return;SS.bank[j].used=true;SS.line.push(j);say(L[SS.bank[j].k][0]);drawBuild();}
function unTile(n){if(SS.answered)return;SS.bank[SS.line[n]].used=false;SS.line.splice(n,1);drawBuild();}
function checkBuild(){const st=SS.steps[SS.i];const got=SS.line.map(j=>SS.bank[j].py).join(" ");const want=tiles(st.s).map(k=>L[k][1]).join(" ");answer(got===want,st);}
/* fill in the blank */
function rFill(st,b){
  const s=st.s,D=DAYS[SS.d]||DAYS[0];const idxs=s.t.map((k,i)=>PUN[k]?-1:i).filter(i=>i>=0);
  const foc=idxs.filter(i=>D.F.includes(s.t[i])||DAYS.some(dd=>dd.F.includes(s.t[i])));const bi=pick(foc.length?foc:idxs);const key=s.t[bi];
  let line="";s.t.forEach((k,i)=>{if(PUN[k])line=line.trimEnd()+PUN[k]+" ";else line+=(i===bi?'<span class="blank" id="blank">&nbsp;</span>':cpy(L[k][1]))+" ";});
  const pool=shuffle(D.F.concat(knownWords(SS.d)).filter(k=>k!==key&&goodWord(k)&&!PUN[k]));
  SS.opts=shuffle([{label:cpy(L[key][1]),ok:true,hz:L[key][0]}].concat(distinct(key,pool,k=>L[k][1],3).map(k=>({label:cpy(L[k][1]),hz:L[k][0]}))));
  b.innerHTML='<div style="flex:1;text-align:center"><div class="ask">Fill in the blank</div><div class="sent-line">'+line+'</div><div class="en">'+s.en+'</div>'+optButtons(SS.opts,"big")+'</div>';}
/* match pairs */
function rMatch(st,b){
  SS.m={left:shuffle(st.ks),right:shuffle(st.ks),sel:null,done:new Set(),miss:0};
  b.innerHTML='<div style="flex:1"><div class="ask" style="text-align:center">Match the pairs</div><div class="match"><div class="col" id="mL"></div><div class="col" id="mR"></div></div></div>';drawMatch();}
function drawMatch(){const m=SS.m;
  $("mL").innerHTML=m.left.map((k,i)=>'<button class="btn mbtn'+(m.done.has(k)?" gone":"")+(m.sel===k?" sel":"")+'" onclick="mPickL('+i+')">'+cpy(L[k][1])+'</button>').join("");
  $("mR").innerHTML=m.right.map((k,i)=>'<button class="btn mbtn'+(m.done.has(k)?" gone":"")+'" id="mr'+i+'" onclick="mPickR('+i+')">'+L[k][2]+'</button>').join("");}
function mPickL(i){const k=SS.m.left[i];if(SS.m.done.has(k))return;SS.m.sel=k;say(L[k][0]);drawMatch();}
function mPickR(i){const m=SS.m,k=m.right[i];if(!m.sel||m.done.has(k))return;
  if(k===m.sel){m.done.add(k);m.sel=null;beep(true);drawMatch();if(m.done.size===m.left.length){SS.right++;const x=m.miss?10:15;SS.xp+=x;addXp(x);logAct();save();bar();
      $("sheetIn").innerHTML='<h3 class="ok">✅ All matched!'+(m.miss?"":' <span class="combo">Perfect +15</span>')+'</h3>';const sh=$("sheet");sh.classList.remove("hidden","badd");sh.classList.add("okk");}}
  else{m.miss++;beep(false);const el=$("mr"+i);el.classList.add("wrong");setTimeout(()=>el.classList.remove("wrong"),400);}}
/* speaking */
function rSpeak(st,b){const s=st.s;
  b.innerHTML='<div class="flash"><span class="tag green">Speak</span><div class="ask">Say it in Chinese</div><div class="py md">"'+s.en+'"</div><div class="audio-row"><button class="round" style="width:80px;height:80px;font-size:34px" onclick="checkSpeech('+r(s.hz)+',this)">🎤</button></div><div class="feedback" id="fb"></div><div id="ans"></div></div><div class="bottom" id="sbtm"><button class="btn big" onclick="revealSpeak()">Show answer</button></div>';}
function revealSpeak(){const s=SS.steps[SS.i].s;$("ans").innerHTML='<div class="py md">'+cpy(s.py)+'</div>'+hzl(s.hz)+'<button class="btn sm ghost" onclick="say('+r(s.hz)+')">🔊 again</button>';$("sbtm").innerHTML='<button class="btn primary big" onclick="next()">Continue</button>';say(s.hz);SS.xp+=5;addXp(5);logAct();bar();}
/* dialogue */
function bubble(line,show,me,turn){const s=line.s;
  if(turn)return'<div class="bub me turn"><div class="who">Your turn</div><div class="p">"'+s.en+'"</div><div class="small mute">Say it out loud, then tap Show</div></div>';
  return'<div class="bub'+(me?" me":"")+'" onclick="say('+r(s.hz)+')"><div class="who">'+(me&&SS.steps[SS.i].t==="role"?"You (Ali)":WHO[line.who])+'</div><div class="p">'+cpy(s.py)+'</div>'+(S.settings.showHz?'<div class="small mute">'+s.hz+'</div>':"")+'<div class="e">'+s.en+'</div></div>';}
function rDlg(st,b){SS.di=0;drawDlg(b);}
function drawDlg(b){const DL=DAYS[SS.d].DL;b=b||$("sessBody");R=[];
  const html=DL.slice(0,SS.di+1).map(l=>bubble(l,true,l.who==="ali")).join("");
  const last=SS.di>=DL.length-1;
  b.innerHTML='<div style="flex:1"><span class="tag green">Listen</span><h2 style="margin-top:8px">Conversation</h2><p class="small mute" style="margin-top:-6px">Tap any line to hear it again.</p><div class="dlg">'+html+'</div></div><div class="bottom">'+(last?'<button class="btn" onclick="replayDlg()">🔁 Play all again</button><button class="btn primary big" onclick="next()">Continue</button>':'<button class="btn primary big" onclick="SS.di++;drawDlg()">Next line ▶</button>')+'</div>';
  say(DL[SS.di].s.hz);b.scrollTop=b.scrollHeight;}
function replayDlg(){const DL=DAYS[SS.d].DL;let i=0;const go=()=>{if(!SS||i>=DL.length)return;const u=DL[i++].s.hz;say(u);setTimeout(go,900+u.length*420/S.settings.rate);};go();}
function rRole(st,b){SS.di=0;SS.rev=false;drawRole(b);}
function drawRole(b){const DL=DAYS[SS.d].DL;b=b||$("sessBody");R=[];
  const line=DL[SS.di],mine=line.who==="ali";
  let html=DL.slice(0,SS.di).map(l=>bubble(l,true,l.who==="ali")).join("");
  html+=mine&&!SS.rev?bubble(line,false,true,true):bubble(line,true,mine);
  const last=SS.di>=DL.length-1;let btm;
  if(mine&&!SS.rev)btm='<div class="audio-row"><button class="round" onclick="checkSpeech('+r(line.s.hz)+',this)">🎤</button></div><div class="feedback" id="fb" style="text-align:center"></div><button class="btn big" onclick="SS.rev=true;drawRole()">Show</button>';
  else btm=last?'<button class="btn primary big" onclick="next()">Continue</button>':'<button class="btn primary big" onclick="SS.di++;SS.rev=false;drawRole()">Next ▶</button>';
  b.innerHTML='<div style="flex:1"><span class="tag">Role-play</span><h2 style="margin-top:8px">You are Ali</h2><div class="dlg">'+html+'</div></div><div class="bottom">'+btm+'</div>';
  if(!mine||SS.rev)say(line.s.hz);b.scrollTop=b.scrollHeight;}

function finish(){
  const sp=SS;let title="Practice done!",sub="";
  if(sp.kind==="part"){
    S.done[sp.d+"-"+sp.p]=true;const D=DAYS[sp.d];
    if(sp.p===0)D.W.filter(goodWord).forEach(k=>addCard("w:"+k));
    if(sp.p===1)D.S.forEach(s=>addCard("s:"+s.id));
    if(sp.p===2)D.DL.filter(l=>l.who==="ali"&&tiles(l.s).length>=2).forEach(l=>addCard("s:"+l.s.id));
    title=dayDone(sp.d)?"Day "+(sp.d+1)+" complete! 🏆":PART[sp.p].n+" done!";
    sub=dayDone(sp.d)?(sp.d===6?"You finished Week 1! Week 2 is coming.":"Tomorrow: Day "+(sp.d+2)+" — "+DAYS[sp.d+1].title):"";
  }
  logAct();save();
  const acc=sp.right+sp.wrong?Math.round(sp.right/(sp.right+sp.wrong)*100):100;const mins=Math.max(1,Math.round((Date.now()-sp.t0)/60000));
  const np=nextPart();const sameDay=np&&sp.kind==="part"&&np[0]===sp.d;
  $("sessBar").style.width="100%";
  $("sessBody").innerHTML='<div class="flash"><div style="font-size:64px">🎉</div><div class="py md">'+title+'</div><div class="stats" style="width:100%"><div class="stat"><b>⭐ '+sp.xp+'</b><span>XP</span></div><div class="stat"><b>'+acc+'%</b><span>correct</span></div><div class="stat"><b>'+mins+'</b><span>minutes</span></div></div><div class="en">🔥 '+streak()+' day streak</div><p class="small mute">'+sub+'</p></div><div class="bottom">'+(sameDay?'<button class="btn primary big" onclick="startPart('+np[0]+','+np[1]+')">Next: '+PART[np[1]].i+' '+PART[np[1]].n+'</button><button class="btn" onclick="closeSess()">Later</button>':'<button class="btn primary big" onclick="closeSess()">Finish</button>')+'</div>';
}

/* ================== VIEWS ================== */
let cur="learn";
function show(v){cur=v;document.querySelectorAll(".view").forEach(s=>s.classList.toggle("active",s.id==="v-"+v));document.querySelectorAll("nav.tabs button").forEach(b=>b.classList.toggle("on",b.dataset.v===v));render();window.scrollTo(0,0);}
document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>show(b.dataset.v));
function render(){R=[];document.body.classList.toggle("nocolor",!S.settings.colors);$("streakChip").textContent="🔥 "+streak();$("xpChip").textContent="⭐ "+(S.xp[today()]||0);
  ({learn:renderLearn,practice:renderPractice,notes:renderNotes,me:renderMe})[cur]();}

function renderLearn(){
  const np=nextPart(),due=dueKeys().length,isRest=new Date().getDay()===S.settings.restDay;let h="";
  if(np){const[d,p]=np;h+='<div class="card hero"><div class="small mute">WEEK 1 · DAY '+(d+1)+' OF 7'+(isRest?" · REST DAY 😌":"")+'</div><h2 style="margin:6px 0 4px">'+DAYS[d].title+'</h2><div class="small mute" style="margin-bottom:14px">'+DAYS[d].goal+'</div><button class="btn primary big" onclick="startPart('+d+','+p+')">▶ '+PART[p].i+' '+PART[p].n+' · ~7 min</button>'+(isRest?'<div class="small mute" style="margin-top:8px">Your streak is safe today — study only if you want to.</div>':"")+'</div>';}
  else h+='<div class="card hero"><h2>Week 1 complete! 🏆</h2><div class="small mute">Amazing work. Keep your memory fresh with the daily review until Week 2 arrives.</div><button class="btn primary big" style="margin-top:12px" onclick="startReview()">🔁 Daily review</button></div>';
  if(voicesChecked&&!zhVoice)h+='<div class="card warn"><h3>🔈 Install the Chinese voice</h3><div class="small">Your device has no Chinese voice yet, so words may sound wrong.<br><br><b>Samsung:</b> Settings → General management → Text-to-speech → <b>Google</b> → ⚙️ → Install voice data → <b>Chinese (Mandarin)</b>. Then restart Chrome.</div></div>';
  h+='<div class="card"><h3>Week 1</h3>';
  DAYS.forEach((D,d)=>{h+='<div class="day"><div><div class="dn">Day '+(d+1)+' · '+D.title+'</div><div class="small mute">'+(dayDone(d)?"✓ Done":avail(d,0)?"Open":"🔒 Locked")+'</div></div><div class="pills">'+[0,1,2].map(p=>{const dn=isDone(d,p),av=avail(d,p),nx=np&&np[0]===d&&np[1]===p;return'<button class="pill'+(dn?" done":nx?" next":av?"":" lock")+'" title="'+PART[p].n+'" onclick="startPart('+d+','+p+')">'+(dn?"✓":av?PART[p].i:"🔒")+'</button>';}).join("")+'</div></div>';});
  h+='<p class="small mute" style="margin:10px 0 0">🆕 New words · 📘 Grammar & sentences · 💬 Conversation. Tap a ✓ to redo it.</p></div>';
  h+='<div class="card"><h3>➕ Got extra time?</h3><div class="grid2"><button class="btn" onclick="startReview()">🔁 Review'+(due?" ("+due+")":"")+'</button><button class="btn" onclick="show(\'practice\')">🎵 Tones & listening</button></div></div>';
  $("v-learn").innerHTML=h;
}

/* ---- practice tab ---- */
const TONESETS=[["ma","妈","麻","马","骂"],["ba","八","拔","把","爸"],["da","搭","达","打","大"],["shi","诗","十","使","是"],["tang","汤","糖","躺","烫"],["wen","温","文","稳","问"],["fei","飞","肥","匪","费"],["guo","锅","国","果","过"],["tu","突","图","土","兔"],["yi","一","姨","椅","意"],["xiang","香","详","想","向"]];
let P={mode:null,score:0,count:0};
function renderPractice(){
  const due=dueKeys().length,shadowDays=DAYS.map((_,d)=>d).filter(d=>isDone(d,2));
  let h='<div class="card"><h2>Extra practice</h2><p class="small mute" style="margin-top:-6px">For when you have more time.</p><div class="grid2"><button class="btn primary" onclick="startReview()">🔁 Review'+(due?" ("+due+" due)":"")+'</button><button class="btn" onclick="P={mode:\'tone\',score:0,count:0};nextTone();renderPractice()">🎵 Tone trainer</button><button class="btn" onclick="P={mode:\'listen\',score:0,count:0};nextListen();renderPractice()">👂 Listening quiz</button>'+
    '<select onchange="if(this.value!==\'\')startShadow(+this.value)"><option value="">🗣️ Shadow a dialogue</option>'+shadowDays.map(d=>'<option value="'+d+'">Day '+(d+1)+': '+DAYS[d].title+'</option>').join("")+'</select></div>'+(shadowDays.length?"":'<p class="small mute">Dialogues unlock after each day\'s 💬 part.</p>')+'</div><div id="pArea"></div>';
  $("v-practice").innerHTML=h;
  if(P.mode==="tone")drawTone();else if(P.mode==="listen")drawListen();
}
function nextTone(){const s=pick(TONESETS);P.set=s;P.tone=1+Math.floor(Math.random()*4);P.ans=null;setTimeout(()=>say(s[P.tone]),200);}
function drawTone(){const s=P.set;
  let h='<div class="card" style="text-align:center"><div class="small mute">Score '+P.score+'/'+P.count+'</div><div class="ask">Which tone did you hear?</div><button class="round huge" onclick="say(P.set[P.tone])">🔊</button><div class="grid2" style="margin-top:12px">';
  for(let t=1;t<=4;t++){let cls="btn opt big";if(P.ans!==null){if(t===P.tone)cls+=" right";else if(t===P.ans)cls+=" wrong";}h+='<button class="'+cls+'" onclick="answerTone('+t+')"><span class="t'+t+'">'+mark(s[0],t)+'</span><div class="small mute" style="font-weight:500">tone '+t+'</div></button>';}
  h+='</div>';if(P.ans!==null)h+='<p class="'+(P.ans===P.tone?"ok":"bad")+'" style="font-weight:700">'+(P.ans===P.tone?"✅ Correct!":"❌ It was tone "+P.tone+" — tap the buttons to compare")+'</p><button class="btn primary" onclick="nextTone();drawTone()">Next →</button>';
  $("pArea").innerHTML=h+'</div>';}
function answerTone(t){if(P.ans!==null){say(P.set[t]);return;}P.ans=t;P.count++;const ok=t===P.tone;beep(ok);if(ok){P.score++;addXp(5);}logAct();save();drawTone();$("xpChip").textContent="⭐ "+(S.xp[today()]||0);}
function nextListen(){let pool=Object.keys(S.cards).filter(k=>k.startsWith("w:")).map(k=>k.slice(2));if(pool.length<4)pool=DAYS[0].W.filter(goodWord);
  const k=pick(pool);P.k=k;P.opts=shuffle([k].concat(distinct(k,wordPool(maxDay(),k),x=>L[x][2],3)));P.ans=null;setTimeout(()=>say(L[k][0]),200);}
function drawListen(){
  let h='<div class="card" style="text-align:center"><div class="small mute">Score '+P.score+'/'+P.count+'</div><div class="ask">What did you hear?</div><button class="round huge" onclick="say(L[P.k][0])">🔊</button><div class="opts">';
  P.opts.forEach((k,i)=>{let cls="btn opt";if(P.ans!==null){if(k===P.k)cls+=" right";else if(i===P.ans)cls+=" wrong";}h+='<button class="'+cls+'" onclick="answerListen('+i+')">'+L[k][2]+'</button>';});
  h+='</div>';if(P.ans!==null)h+='<p class="py md" style="margin:12px 0 4px">'+cpy(L[P.k][1])+'</p><button class="btn primary" onclick="nextListen();drawListen()">Next →</button>';
  $("pArea").innerHTML=h+'</div>';}
function answerListen(i){if(P.ans!==null){say(L[P.opts[i]][0]);return;}P.ans=i;P.count++;const ok=P.opts[i]===P.k;beep(ok);if(ok){P.score++;addXp(5);}logAct();save();drawListen();$("xpChip").textContent="⭐ "+(S.xp[today()]||0);}

/* ---- notes tab ---- */
let openN={};
function renderNotes(){
  let h='<div class="card"><h2>Grammar notes</h2><p class="small mute" style="margin-top:-6px">Every grammar card you\'ve unlocked. Tap examples to hear them.</p>';
  let any=false;
  DAYS.forEach((D,d)=>{if(!isDone(d,1)&&!(avail(d,1)))return;any=true;
    h+='<div class="acc"><div class="acc-h" onclick="openN['+d+']=!openN['+d+'];renderNotes()"><span>Day '+(d+1)+' · '+D.title+'</span><span>'+(openN[d]?"▲":"▼")+'</span></div>';
    if(openN[d])h+=D.G.map(g=>'<div class="gnote"><h4>'+g.title+'</h4>'+gramHtml(g)+'</div>').join("");h+='</div>';});
  if(!any)h+='<p class="mute">Finish 🆕 New words of Day 1 to unlock the first notes.</p>';
  h+='</div>';
  const ws=Object.keys(S.cards).filter(k=>k.startsWith("w:")).map(k=>k.slice(2)).filter(k=>L[k]);
  h+='<div class="card"><h2>My words <span class="small mute">('+ws.length+')</span></h2>'+(ws.length?ws.map(k=>'<div class="w" onclick="say('+r(L[k][0])+')"><span class="p">'+cpy(L[k][1])+(S.settings.showHz?' <span class="small mute">'+L[k][0]+'</span>':"")+'</span><span class="e">'+L[k][2]+'</span></div>').join(""):'<p class="mute">Words appear here after each 🆕 part.</p>')+'</div>';
  $("v-notes").innerHTML=h;
}

/* ---- me tab ---- */
function renderMe(){
  const st=S.settings,ws=Object.keys(S.cards).filter(k=>k.startsWith("w:")).length,ss=Object.keys(S.cards).length-ws;
  const days=[];for(let i=13;i>=0;i--)days.push(new Date(Date.now()-i*DAY));
  const max=Math.max(1,...days.map(d=>S.xp[dkey(d)]||0));
  let h='<div class="card"><h2>Progress</h2><div class="stats four"><div class="stat"><b>🔥 '+streak()+'</b><span>day streak</span></div><div class="stat"><b>⭐ '+totalXp()+'</b><span>total XP</span></div><div class="stat"><b>'+ws+'</b><span>words</span></div><div class="stat"><b>'+ss+'</b><span>sentences</span></div></div>';
  h+='<div class="small mute">XP — last 14 days</div><div class="bars">'+days.map(d=>{const v=S.xp[dkey(d)]||0;const rest=!v&&d.getDay()===st.restDay;return'<div class="'+(v?"":rest?"rest":"zero")+'" style="height:'+(v?Math.max(8,v/max*100):rest?30:4)+'%"></div>';}).join("")+'</div><div class="blabels">'+days.map(d=>'<span>'+"SMTWTFS"[d.getDay()]+'</span>').join("")+'</div></div>';
  h+='<div class="card"><h3>Settings</h3>';
  h+='<div class="set"><span>Voice speed</span><select onchange="S.settings.rate=+this.value;save();say(\'你好，很高兴认识你\')">'+[[0.6,"Slow"],[0.75,"Calm"],[0.85,"Normal"],[1,"Native"]].map(o=>'<option value="'+o[0]+'"'+(o[0]===st.rate?" selected":"")+'>'+o[1]+'</option>').join("")+'</select></div>';
  h+='<div class="set"><span>Rest day (streak safe)</span><select onchange="S.settings.restDay=+this.value;save();render()">'+[[-1,"None"],[1,"Monday"],[2,"Tuesday"],[3,"Wednesday"],[4,"Thursday"],[5,"Friday"],[6,"Saturday"],[0,"Sunday"]].map(o=>'<option value="'+o[0]+'"'+(o[0]===st.restDay?" selected":"")+'>'+o[1]+'</option>').join("")+'</select></div>';
  [["colors","Color the tones",1],["autoplay","Auto-play sound"],["sfx","Sound effects"],["showHz","Show Chinese characters",1]].forEach(([k,lab,re])=>{h+='<div class="set"><span>'+lab+'</span><input type="checkbox" '+(st[k]?"checked":"")+' onchange="S.settings.'+k+'=this.checked;save();'+(re?"render()":"")+'"></div>';});
  h+='<div class="set"><span>Voice: <span class="small '+(zhVoice?"ok":"bad")+'">'+(zhVoice?"Chinese ✓":"no Chinese voice")+'</span></span><button class="btn sm" onclick="say(\'你好，很高兴认识你\')">Test 🔊</button></div></div>';
  h+='<div class="card"><h3>Backup</h3><p class="small mute" style="margin-top:-4px">Progress lives only on this device. Save a backup once a week.</p><div class="grid2"><button class="btn" onclick="exportData()">⬇ Save backup</button><button class="btn" onclick="$(\'imp\').click()">⬆ Restore</button></div><input type="file" id="imp" accept=".json,application/json" class="hidden" onchange="importData(this)"><button class="btn ghost" style="margin-top:10px;color:var(--red)" onclick="resetAll()">Reset all progress</button></div>';
  $("v-me").innerHTML=h;
}
function exportData(){const b=new Blob([JSON.stringify(S)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="pinyinflow-backup-"+today()+".json";document.body.appendChild(a);a.click();a.remove();toast("Backup saved to Downloads");}
function importData(inp){const f=inp.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const p=JSON.parse(rd.result);if(!p.done)throw 0;S=Object.assign(defState(),p);S.settings=Object.assign(defState().settings,p.settings||{});save();render();toast("Progress restored ✓");}catch(e){toast("That file isn't a PinyinFlow backup");}inp.value="";};rd.readAsText(f);}
function resetAll(){if(confirm("Delete all progress? This can't be undone.")){S=defState();save();render();toast("Progress reset");}}

render();
if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{});});}
</script>
